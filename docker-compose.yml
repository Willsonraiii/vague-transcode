services:
  rtx-online:
    build:
      context: .
      dockerfile: Dockerfile.online
    restart: unless-stopped
    env_file: .env
    ports:
      - "3005:3005"
    volumes:
      - rtx-jobs:/app/jobs
    mem_limit: 4g
  # Daily CPU blip so Oracle's free tier does not reclaim an idle instance.
  keepalive:
    image: busybox:stable
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "while true; do
        day_start=$$(date +%s);
        while [ $$(( $$(date +%s) - day_start )) -lt 300 ]; do
          dd if=/dev/zero bs=1M count=200 2>/dev/null | md5sum > /dev/null;
        done;
        sleep 86400;
      done"
volumes:
  rtx-jobs:
